services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tarot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  app:
    build: .
    env_file: .env.example
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  pgdata:
